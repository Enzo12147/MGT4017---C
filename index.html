<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Your Health Ally</title><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap' rel='stylesheet'><link rel='stylesheet' href='css/style.css'></head><body><header class='hero'><h1>🌿 Your Health Ally</h1><p>Personalized nutrition, fitness & skincare</p><button onclick="showSection('dashboard')">Get Started</button></header><main class='container'><section id='dashboard' class='card'><h2>Health Dashboard</h2><div class='grid'><div class='stat'><span>2100</span><p>Calories</p></div><div class='stat'><span>2.5L</span><p>Water</p></div><div class='stat'><span>8500</span><p>Steps</p></div><div class='stat'><span>7.8h</span><p>Sleep</p></div></div></section><section class='card'><h2>Skin Scan</h2><input type='file' id='scan'><div id='result'>Upload a photo for mock analysis.</div></section><section class='card'><h2>BMI Calculator</h2><input id='h' placeholder='Height cm'><input id='w' placeholder='Weight kg'><button onclick='calcBMI()'>Calculate</button><p id='bmi'></p></section></main><script src='js/app.js'></script></body></html>
